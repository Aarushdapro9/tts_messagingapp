<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>10 Bullets</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #000; }
    #flash-container { position: absolute; top: 50%; left: 50%; background: #000; transform: translate(-50%, -50%); }
    ruffle-player { display: block; width: 100%; height: 100%; background: #000; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@ruffle-rs/ruffle@0.2.0-nightly.2025.10.2/ruffle.min.js"></script>
</head>
<body>
  <div id="flash-container"></div>
  <script>
    const container = document.getElementById('flash-container');
    function resizeGame() {
      const aspectRatio = 16 / 9;
      let width = Math.floor(window.innerWidth);
      let height = Math.floor(width / aspectRatio);
      if (height > window.innerHeight) { height = Math.floor(window.innerHeight); width = Math.floor(height * aspectRatio); }
      container.style.width = `${width}px`;
      container.style.height = `${height}px`;
    }
    window.addEventListener('resize', resizeGame);
    window.addEventListener('DOMContentLoaded', () => {
      resizeGame();
      const ruffle = window.RufflePlayer?.newest() || window.RufflePlayer?.createPlayer();
      if (!ruffle) { container.textContent = 'Ruffle failed to load.'; return; }
      const player = ruffle.createPlayer();
      player.style.width = '100%';
      player.style.height = '100%';
      container.appendChild(player);
      player.load('https://cdn.jsdelivr.net/gh/ap-math-class/exams@main/swf/10Bullets.swf');
    });
  </script>
</body>
</html>
